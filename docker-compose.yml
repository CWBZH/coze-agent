version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: customer_agent_redis
    command: redis-server --requirepass 123456
    ports:
      - "6379:6379"
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    container_name: customer_agent_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./temp/qdrant_data:/qdrant/storage
    restart: always